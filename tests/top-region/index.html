<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>上方區固定與收合邊界測試</title>
    <link rel="stylesheet" href="../../styles/variables.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ui-color-text, #182230);
        font-family: var(--ui-font-family, system-ui, sans-serif);
      }
      main { padding: 0; }
      #fixture { min-height: 100vh; }
      #results {
        min-height: 8rem;
        padding: 1rem;
        white-space: pre-wrap;
        line-height: 1.6;
        border: 1px solid var(--ui-color-border, #cbd5e1);
      }
      #scroll-note { margin-top: 1rem; }
    </style>
    <script>
      (() => {
        window.__topRegionTestCompleted = 0;
        window.__topRegionTestLines = [];
        window.__topRegionReportError = (message) => {
          const write = () => {
            const results = document.getElementById("results");
            if (!results) return;
            const lines = window.__topRegionTestLines || [];
            const count = window.__topRegionTestCompleted || 0;
            results.textContent = [
              ...lines,
              `ERROR  ${message}`,
              `已完成：${count} 項`
            ].join("\n");
            results.dataset.status = "error";
          };
          if (document.getElementById("results")) write();
          else document.addEventListener("DOMContentLoaded", write, { once: true });
        };

        window.addEventListener("error", (event) => {
          if (event.target instanceof HTMLScriptElement) {
            window.__topRegionReportError(
              `腳本載入或模組解析失敗：${event.target.src || "未知來源"}`
            );
          } else {
            window.__topRegionReportError(
              event.message || "發生未捕捉的執行錯誤"
            );
          }
        }, true);

        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason instanceof Error
            ? `${event.reason.name}: ${event.reason.message}`
            : String(event.reason);
          window.__topRegionReportError(`未處理的 Promise 錯誤：${reason}`);
        });
      })();
    </script>
  </head>
  <body>
    <main>
      <div id="fixture"></div>
      <h1>上方區固定與收合邊界測試</h1>
      <p>本頁載入容器及四個區域，以瀏覽器實際捲動左、中、右區，檢查上方區位置與容器介面邊界。</p>
      <h2>測試結果</h2>
      <pre id="results" aria-live="polite" data-status="loading">測試頁已載入，等待 DOM 就緒並啟動測試…</pre>
      <p id="scroll-note">本頁測試的是左、中、右區內部捲動時，上方區是否保持原位。</p>
    </main>
    <script type="module" src="./test-runner.js"></script>
  </body>
</html>
